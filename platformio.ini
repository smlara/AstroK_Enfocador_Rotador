[env]
; --- VERSIÓN GLOBAL ---
custom_version = 1.5.1
; --- CONTROL MANUAL ---
; 1 = tres pulsadores (S1 sube, S2 baja, SW el de siempre); 0 = encoder rotatorio.
; Vale igual para enfocador y rotador.
custom_botones = 0
platform = espressif32
framework = arduino
board_build.filesystem = littlefs
extra_scripts = pre:rename_firmware.py
monitor_speed = 115200
monitor_filters = time
lib_deps =
    waspinator/AccelStepper @ ^1.64
    adafruit/Adafruit SSD1306 @ ^2.5.13
    adafruit/Adafruit GFX Library @ ^1.11.11
    SPI
    Wire
    teemuatlut/TMCStepper @ ^0.7.3
    bblanchon/ArduinoJson @ ^7.0.4
    h2zero/NimBLE-Arduino @ ^1.4.3
build_flags = 
    -Wall
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D FW_VERSION=\"${env.custom_version}\"
    -D CONTROL_CON_BOTONES=${env.custom_botones}
    ; BLE solo como periférico y con un cliente: quitar los papeles de central
    ; y observador ahorra flash, que va justa con WiFi y NimBLE juntos.
    -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -D CONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -D CONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
; [env:astrok-s3]

; board = esp32-s3-devkitc-1
; build_flags = ${env.build_flags} -D ARDUINO_ESP32_S3

[env:astrok-c3]

board = esp32-c3-devkitm-1
build_flags = ${env.build_flags} -D ARDUINO_ESP32_C3
; Con el stub de esptool el USB nativo del C3 deja de responder justo tras
; cargarlo ("No serial data received"); grabando con el cargador de la ROM va bien.
upload_flags = --no-stub

; Motor 35BY48 de un ZWO EAF (iman permanente, 48 pasos/vuelta, 120:1, 12 V),
; pensado sobre todo como enfocador. Solo cambia los valores por defecto (ver
; MOTOR_35BY48 en Config.h); el modo sigue saliendo del jumper.
[env:astrok-c3-35by48]
extends = env:astrok-c3
custom_motor = 35BY48
build_flags = ${env:astrok-c3.build_flags} -D MOTOR_35BY48

; Firmware minimo de prueba: anuncia la placa por BLE y hace eco por un
; servicio tipo Nordic UART. Solo sirve para comprobar que el PC la ve.
[env:ble-test-c3]
platform = espressif32@6.3.0
framework = arduino
board = esp32-c3-devkitm-1
monitor_speed = 115200
upload_flags = --no-stub
lib_deps = h2zero/NimBLE-Arduino @ ^1.4.3
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
